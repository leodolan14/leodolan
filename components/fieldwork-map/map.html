<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldwork map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; background: transparent; font-family: 'Work Sans', Helvetica, Arial, sans-serif; }
  #wrap { display: flex; flex-wrap: wrap; width: 100%; box-sizing: border-box; padding: 20px; gap: 20px; }
  #mapcol { flex: 1 1 320px; position: relative; display: flex; align-items: center; justify-content: center; min-height: 320px; }
  svg { width: 100%; height: 100%; max-height: 520px; }
  .country { fill: #e4ded1; stroke: #f7f4ee; stroke-width: .6; }
  .country.ssa { fill: #d8cfb8; }
  .dot { cursor: pointer; }
  .dot circle { fill: #8a6a3f; stroke: #f7f4ee; stroke-width: 2; transition: r .2s; }
  .dot:hover circle, .dot.active circle { fill: #443235; }
  .dot:focus-visible { outline: 2px solid #916a70; outline-offset: 3px; }
  .dot:focus-visible circle { fill: #443235; }
  #tooltip { position: absolute; left: 0; top: 0; transform: translate(-50%, -130%); background: #443235; color: #fff; font: 500 11px 'Work Sans', sans-serif; letter-spacing: .01em; padding: 5px 9px; border-radius: 3px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s ease; z-index: 1; }
  #tooltip.is-visible { opacity: 1; }
  #panel { flex: 1 1 260px; min-width: 240px; max-width: 380px; padding: 0 6px; display: flex; flex-direction: column; justify-content: center; }
  #panel img { width: 100%; height: 220px; object-fit: cover; display: block; border-radius: 2px; background: #ddd0d0; }
  #eyebrow { font: 600 11px 'Work Sans', sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8a6a3f; margin: 16px 0 6px; }
  #paneltitle { font: italic 400 24px 'Playfair Display', serif; color: #443235; margin: 0 0 10px; line-height: 1.2; }
  #desc { font: 400 14px/1.6 'Work Sans', sans-serif; color: #77746c; margin: 0; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 639px) {
    #wrap { padding: 16px; gap: 16px; }
    #panel { max-width: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="mapcol">
    <svg viewBox="0 0 600 620" role="img" aria-label="Map of Africa with five fieldwork markers"></svg>
    <div id="tooltip"></div>
  </div>
  <div id="panel">
    <img id="panelimg" src="" alt="">
    <div id="eyebrow">Fieldwork</div>
    <h2 id="paneltitle">Select a marker</h2>
    <p id="desc">Explore where the archival research behind Africa @ Work has taken place.</p>
  </div>
</div>
<script type="module" src="map.js"></script>
</body>
</html>
