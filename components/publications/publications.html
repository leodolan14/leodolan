<div class="publications container--wide page-section">
  <p class="u-eyebrow">Publications and working papers</p>

  <div class="publications__layout">
    <div class="publications__lists">
      <h2 class="u-page-title publications__group-title">Publications</h2>
      <div class="publications__list" data-list="publications"></div>

      <h2 class="u-page-title publications__group-title">Working papers</h2>
      <div class="publications__list" data-list="working-papers"></div>

      <template class="publications__item-template">

          <p class="publications__citation"></p>

    <figure class="publications__figure">
