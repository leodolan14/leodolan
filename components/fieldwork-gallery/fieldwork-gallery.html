<!--
  INSTRUCTIONS: how to add a new photo to this gallery
  1. Put the image file in the assets/images folder.
  2. Copy one whole <figure>...</figure> block below (pick any one) and
     paste it inside one of the three <div class="fieldwork-gallery__column">
     sections, wherever you'd like the new photo to appear.
  3. In your pasted copy, change:
     - src="assets/images/YOUR-FILE-NAME.jpg" to your new file's name
     - width and height to the image's real pixel size (any photo app or
       "Get Info" / "Properties" on the file will show this)
     - alt="..." to a short plain-text description (for screen readers)
     - the caption text inside <p class="fieldwork-gallery__caption">
  4. Pick the shape class that best matches your photo and use it in place
     of the second class on the <figure> tag:
     --tall (portrait, roughly 3:4), --wide (landscape, roughly 4:3),
     --panorama (very wide), --portrait (very tall), --phone (phone-camera
     portrait, roughly 9:16). This controls how the photo is cropped.
  To remove a photo, delete its whole <figure>...</figure> block.
-->
